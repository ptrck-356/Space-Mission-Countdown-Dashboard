<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Space Mission Countdown Dashboard</title>
     <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
<main>
<!--Log-In or Validiation form-->
<section id="validForm" class="validForm">
     <form id="form">
          <div class="inputCont">
               <label for="missionName">Mission Name</label>
               <input type="text" name="missionName" id="missionName" placeholder="Enter Mission Name">
          </div>
          <div class="inputCont">
               <label for="commanderName">Commander Name</label>
               <input type="text" name="commanderName" id="commanderName" placeholder="Enter Commander Name">
          </div>

          <span id="status"></span>
          <button>Submit</button>
     </form>
</section>



<!--Main Dashboard-->
<section id="mainDashboard" class="mainDashboard">
<div class="head">
     <h1>Welcome, Commander <span id="name" style="all: unset; color: var(--btn-primary-bg);"></span>!</h1>
</div>
<div id="liveClock" class="liveClock">
     <span id="currentTime" class="currentTime"></span>
</div>

<div id="countdown" class="countdown">
     <span id="countdownDisplay" class="countdownTime">00:00:00</span>
</div>
<div class="btnContainer">
     <button><i class="fas fa-hourglass-start"></i> Start Sequence</button>
     <button><i class="fas fa-ban"></i> Abort</button>
     <button><i class="fa-solid fa-arrow-rotate-left"></i>Reset</button>
</div>
</section>
</main>

<button id="themeToggle" class="themeToggle"><i class="fa-solid fa-circle-radiation"></i> Engage Red Alert</button>

<footer class="siteFooter">
     <p>&copy; <span id="footerYear"></span> John Patrick Agravante. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
